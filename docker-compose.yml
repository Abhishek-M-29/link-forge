version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://link_forge_user:password123@db:5432/link_forge
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_change_in_production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Run migrations before starting the application
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=link_forge_user
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=link_forge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link_forge_user -d link_forge"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
